teleop_twist_joy_node:
  ros__parameters:
    # Xbox One Controller Mapping Reference:
    # Buttons: A:0, B:1, X:2, Y:3, LB:4, RB:5, Back:6, Start:7
    # Axes: Left Stick X:0, Left Stick Y:1, LT:2, Right Stick X:3, Right Stick Y:4, RT:5
    
    require_enable_button: true
    enable_button: 5       # Right Bumper (RB) acts as the deadman switch
    
    axis_linear:
      x: 1                 # Left Stick Y-axis (Forward/Backward)
    
    axis_angular:
      yaw: 3               # Right Stick X-axis (Left/Right Rotation)
    
    scale_linear:
      x: 0.5               # Max forward speed: 0.5 m/s
    
    scale_angular:
      yaw: 0.5             # Max rotational speed: 0.5 rad/s